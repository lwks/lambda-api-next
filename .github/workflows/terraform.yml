name: Terraform infrastructure

on:
  pull_request:
    branches:
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply Terraform changes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          test -n "$AWS_ROLE_ARN" || {
            echo "::error::Missing secret AWS_ROLE_ARN"
            exit 1
          }
          test -n "$TF_STATE_BUCKET" || {
            echo "::error::Missing secret TF_STATE_BUCKET"
            exit 1
          }

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        working-directory: terraform
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=lambda-api-next/development.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Create Terraform plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Apply Terraform
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

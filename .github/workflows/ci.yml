name: CI and deploy development Lambda

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '20.x'
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: lambda_api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy-development:
    name: Deploy development Lambda
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo "Missing secret AWS_ROLE_ARN"; exit 1; }

      - name: Create Lambda deployment package
        run: zip -r lambda-api.zip src node_modules package.json package-lock.json

      - name: Upload deployment package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-api-${{ github.sha }}
          path: lambda-api.zip
          if-no-files-found: error
          retention-days: 14

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update development Lambda code
        env:
          FUNCTION_NAME: ${{ env.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda-api.zip \
            --region "$AWS_REGION"
